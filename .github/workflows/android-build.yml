name: Android CI/CD - Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease --stacktrace --no-daemon || echo "Release build failed - this is expected if keystore is not configured"
      continue-on-error: true
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}

    - name: Upload Release APK (if available)
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
      continue-on-error: true

    - name: Build Summary
      if: always()
      run: |
        echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ Release APK built successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Release APK not built (keystore required)" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 APK artifacts are available in the workflow run" >> $GITHUB_STEP_SUMMARY
