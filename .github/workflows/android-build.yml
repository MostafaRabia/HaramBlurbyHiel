name: Android CI/CD - Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Check for Release Keystore
      id: check_keystore
      run: |
        if [ -f "haramblur-release-key.keystore" ]; then
          echo "keystore_exists=true" >> $GITHUB_OUTPUT
          echo "✅ Keystore found - will build signed release APK"
        else
          echo "keystore_exists=false" >> $GITHUB_OUTPUT
          echo "⚠️ Keystore not found - will build release APK with debug signing"
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success() && hashFiles('app/build/outputs/apk/release/*.apk') != ''
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Build Summary
      if: always()
      run: |
        echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Debug APK built successfully" >> $GITHUB_STEP_SUMMARY
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          if [ "${{ steps.check_keystore.outputs.keystore_exists }}" = "true" ]; then
            echo "✅ Release APK built with proper signing" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Release APK built with debug signing (no keystore found)" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ Release APK build failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📦 APK artifacts are available in the workflow run" >> $GITHUB_STEP_SUMMARY
